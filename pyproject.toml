[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jonytechla-alignrsr_jd021"
version = "0.1.0"
description = "从输入中抽取数值，计算对齐算法研究员·拒答边界与过度拒答相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jonytechla" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jonytechla.github.io"
Repository = "https://github.com/jonytechla/alignrsr_jd021"
Issues = "https://github.com/jonytechla/alignrsr_jd021/issues"

[project.scripts]
alignrsr_jd021 = "alignrsr_jd021:main"

[tool.setuptools]
py-modules = ["alignrsr_jd021"]
